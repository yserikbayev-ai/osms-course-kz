<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Обучение медперсонала по нормативным правовым актам РК: курсы по направлениям деятельности медорганизации, тесты, поиск по нормам.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:light dark}</style>
<style>
:root{
  --ground:#F5F7F7; --surface:#FFFFFF; --surface-2:#EDF1F1; --line:#D7E0E0; --line-soft:#E6ECEC;
  --ink:#16232B; --ink-2:#4A5C64; --ink-3:#74868D;
  --accent:#0E6E6B; --accent-ink:#0A4F4D; --accent-wash:#E4EFEE;
  --brass:#B07A2B; --brass-wash:#F6EEE0;
  --good:#2E7D53; --good-wash:#E6F1EA; --warn:#B4711A; --warn-wash:#F8EEE1; --crit:#B03A3A; --crit-wash:#F7E8E8;
  --shadow:0 1px 2px rgba(22,35,43,.06),0 8px 24px -12px rgba(22,35,43,.18);
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0F171C; --surface:#16212A; --surface-2:#1D2A33; --line:#2A3A44; --line-soft:#223039;
    --ink:#E7EDEE; --ink-2:#A9B9BF; --ink-3:#7D8F97;
    --accent:#3FA9A2; --accent-ink:#8FD6D0; --accent-wash:#153033;
    --brass:#D2A055; --brass-wash:#2C2418;
    --good:#5FBF89; --good-wash:#152A20; --warn:#DDA45C; --warn-wash:#2C2317; --crit:#E07A7A; --crit-wash:#2E1C1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F171C; --surface:#16212A; --surface-2:#1D2A33; --line:#2A3A44; --line-soft:#223039;
  --ink:#E7EDEE; --ink-2:#A9B9BF; --ink-3:#7D8F97;
  --accent:#3FA9A2; --accent-ink:#8FD6D0; --accent-wash:#153033;
  --brass:#D2A055; --brass-wash:#2C2418;
  --good:#5FBF89; --good-wash:#152A20; --warn:#DDA45C; --warn-wash:#2C2317; --crit:#E07A7A; --crit-wash:#2E1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --ground:#F5F7F7; --surface:#FFFFFF; --surface-2:#EDF1F1; --line:#D7E0E0; --line-soft:#E6ECEC;
  --ink:#16232B; --ink-2:#4A5C64; --ink-3:#74868D;
  --accent:#0E6E6B; --accent-ink:#0A4F4D; --accent-wash:#E4EFEE;
  --brass:#B07A2B; --brass-wash:#F6EEE0;
  --good:#2E7D53; --good-wash:#E6F1EA; --warn:#B4711A; --warn-wash:#F8EEE1; --crit:#B03A3A; --crit-wash:#F7E8E8;
  --shadow:0 1px 2px rgba(22,35,43,.06),0 8px 24px -12px rgba(22,35,43,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.22;font-weight:640;letter-spacing:-.012em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.topbar{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
:root[data-theme="dark"] .mark,:root:not([data-theme="light"]) .mark{color:#08211F}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .mark{color:#fff}}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.topbar .wrap{min-height:0;padding-top:10px;padding-bottom:10px}.tabs{width:100%}.tab{flex:1;text-align:center}}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.tab{padding:6px 13px;border-radius:7px;font-size:13.5px;color:var(--ink-2);font-weight:520;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main{padding:26px 0 72px}
.cols{display:grid;grid-template-columns:296px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-pad{padding:20px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* Лестница грейдов */
.ladder{display:flex;flex-direction:column;gap:0;padding:6px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:13px 12px;border-radius:8px;text-align:left;width:100%;align-items:start;position:relative}
.step+.step{margin-top:2px}
.step::before{content:"";position:absolute;left:28px;top:-2px;height:15px;width:2px;background:var(--line)}
.step:first-child::before{display:none}
.step[data-state="done"]::before{background:var(--good)}
.step:hover:not([disabled]){background:var(--surface-2)}
.step[aria-current="true"]{background:var(--accent-wash)}
.step[disabled]{opacity:.55;cursor:not-allowed}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;border:1.5px solid var(--line);color:var(--ink-3);background:var(--surface)}
.step[data-state="open"] .dot{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.step[data-state="done"] .dot{border-color:var(--good);background:var(--good);color:#fff}
.step h4{font-size:14.5px}
.step small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.step .st{margin-top:6px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip.locked{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.chip.open{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent)}
.chip.done{background:var(--good-wash);color:var(--good);border-color:var(--good)}
.chip.warn{background:var(--warn-wash);color:var(--warn);border-color:var(--warn)}
.chip.crit{background:var(--crit-wash);color:var(--crit);border-color:var(--crit)}
:root[data-theme="dark"] .chip.done,:root[data-theme="dark"] .chip.open{border-color:transparent}

.meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
.meter.good i{background:var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:8px;font-size:14.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:.15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08211F}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:transparent}

.hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.hd .grow{flex:1;min-width:240px}
.hd h2{font-size:23px}
.lead{color:var(--ink-2);font-size:14.5px;margin-top:5px;max-width:62ch}

/* Карточка нормы */
.norm{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.norm+.norm{margin-top:14px}
.norm-h{display:flex;gap:10px;align-items:baseline;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pt{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-wash);padding:2px 7px;border-radius:5px;white-space:nowrap}
:root[data-theme="dark"] .pt{color:var(--accent-ink);background:var(--accent-wash)}
.norm-h .src{font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis}
.norm-b{padding:16px}
.quote{font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink);border-left:3px solid var(--line);padding-left:14px}
.plain{margin-top:13px;font-size:14.5px;color:var(--ink-2);display:flex;gap:9px}
.plain b{color:var(--accent-ink);font-weight:650;flex:none}
:root[data-theme="dark"] .plain b{color:var(--accent)}
.srcline{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Экзамен */
.exam-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:sticky;top:66px;z-index:10;box-shadow:var(--shadow)}
.timer{font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--crit)}
.qnum{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qbody{margin-top:16px}
.qtext{font-size:18px;font-weight:600;line-height:1.42;margin-bottom:16px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;font-size:15px;line-height:1.45;transition:.12s;width:100%}
.opt:hover{border-color:var(--accent);background:var(--accent-wash)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .k{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;flex:none;margin-top:1px}
.opt[aria-pressed="true"] .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--crit);background:var(--crit-wash)}
.opt.wrong .k{background:var(--crit);color:#fff;border-color:var(--crit)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line);background:var(--surface)}
.opt.right[disabled]:hover{border-color:var(--good);background:var(--good-wash)}
.opt.wrong[disabled]:hover{border-color:var(--crit);background:var(--crit-wash)}

.explain{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;background:var(--surface-2)}
.explain .t{font-size:14.5px;line-height:1.55}
.exam-foot{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}

/* Результат */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;background:var(--surface)}
.stat .v{font-size:29px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.stat.pass{border-color:var(--good)}.stat.pass .v{color:var(--good)}
.stat.fail{border-color:var(--crit)}.stat.fail .v{color:var(--crit)}
.delta{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}

.ca{border:1px solid var(--warn);background:var(--warn-wash);border-radius:var(--r);padding:18px}
.ca h3{font-size:16px;color:var(--warn)}
.calist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:9px}
.calist li{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.calist input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.calist .n{font-size:14.5px;font-weight:600}
.calist .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* Сертификат */
.cert{border:1.5px solid var(--brass);border-radius:var(--r);background:var(--brass-wash);padding:34px 30px;text-align:center;font-family:var(--serif)}
.cert .ttl{font-size:26px;font-weight:600;letter-spacing:.01em}
.cert .nm{font-size:22px;margin:16px 0 4px;font-weight:600}
.cert .ln{width:64px;height:2px;background:var(--brass);margin:18px auto}
.cert .meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.02em}
.cert .code{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--brass);letter-spacing:.06em;margin-top:6px}

/* Таблица дашборда */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.note{font-size:13px;color:var(--ink-3);line-height:1.55}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--ink-3);font-size:12.5px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
/* ---- дополнения второй версии ---- */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 12px;min-width:220px;flex:1;max-width:380px}
.searchbox svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round}
.searchbox input{border:0;background:none;outline:none;color:var(--ink);font:inherit;font-size:14px;padding:9px 0;width:100%}
.searchbox input::placeholder{color:var(--ink-3)}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:inherit}

.dirgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.dircard{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:.15s;width:100%}
.dircard:hover{border-color:var(--accent);transform:translateY(-1px)}
.dirmark{width:40px;height:40px;flex:none;border-radius:9px;background:var(--accent-wash);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
:root[data-theme="dark"] .dirmark{color:var(--accent)}
.dirbody{flex:1;min-width:0}
.dirbody h3{font-size:16.5px}

.course.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.stepn{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.chip.rec{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .chip.rec{color:#08211F}
.chip.lvl1{background:var(--good-wash);color:var(--good);border-color:var(--good)}
.chip.lvl2{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent)}
.chip.lvl3{background:var(--warn-wash);color:var(--warn);border-color:var(--warn)}
.chip.video{background:var(--brass-wash);color:var(--brass);border-color:var(--brass)}
.crumb{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--ink-3)}
.crumb:hover{color:var(--accent);border-color:var(--accent)}

.videoblock{overflow:hidden;padding:0}
.ratio{position:relative;width:100%;padding-top:56.25%;background:#000}
.ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.videostub{border-style:dashed}
.vicon{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:13px}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:400}
.quick{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:.15s;display:flex;flex-direction:column;gap:4px}
.quick:hover{border-color:var(--accent);background:var(--accent-wash)}
.quick b{font-size:14.5px}

.hit{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface);transition:.12s}
.hit:hover{border-color:var(--accent);background:var(--accent-wash)}
.hit b{font-size:14.5px;font-weight:620}

@media (max-width:760px){
  .searchbox{order:3;max-width:none;flex-basis:100%}
  .tabs{order:2;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:6px 11px;font-size:13px}
}
@media (max-width:420px){
  .brand span{display:none}
  .tab{padding:6px 9px;font-size:12.5px}
}

/* Документ остаётся читаемым и в тёмной теме. */
.print-controls{display:grid;gap:12px}
.course-document{background:#fff;color:#000;padding:24px;overflow-wrap:anywhere;line-height:1.5}
.course-document h1{font-size:24px;margin:12px 0}
.course-document h2{font-size:20px;margin:24px 0 12px}
.course-document h3{font-size:15px;margin:0 0 10px}
.course-document p{margin:10px 0}
.course-document a{color:#000}
.print-norm{margin:18px 0;padding-top:12px;border-top:1px solid #aaa}
.print-source{font-size:12px}
@media print{
  @page{size:A4;margin:16mm}
  body.printing-course{background:#fff;color:#000;color-scheme:light}
  body.printing-course > header,body.printing-course > footer,
  body.printing-course .print-controls{display:none!important}
  body.printing-course main,body.printing-course .wrap{padding:0;max-width:none}
  body.printing-course #app{display:block}
  .course-document{padding:0;font-size:11pt}
  .course-document h1{font-size:20pt}
  .course-document h2{font-size:16pt}
  .course-document h3{font-size:12pt}
  .course-document h1,.course-document h2,.course-document h3{break-after:avoid}
  .course-document p{orphans:3;widows:3}
  .print-lesson + .print-lesson{break-before:page}
  .print-norm{break-inside:avoid}
}

</style>

  { id:'c-osms-drug', dir:'finance', step:2, title:'Лекарственное обеспечение в ГОБМП и ОСМС',
    intro:'Запас препаратов, рецепт, маркировка при отпуске и порядок в отдалённых населённых пунктах.',
    lessons:['L2.2'] },
  { id:'c-osms-monitor', dir:'finance', step:3, title:'Мониторинг Фонда: дефекты и снятие оплаты',
    intro:'Виды дефектов, сроки возражения, момент невозвратности исправлений и пороги ответственности.',
    lessons:['L3.1','L3.2','L3.3'] }
];

/* Уровень сложности — метка материала, а не ступень допуска. */
const LEVELS = {
  1:{ name:'Базовый',     hint:'знание нормы' },
  2:{ name:'Продвинутый', hint:'применение в ситуации' },
  3:{ name:'Экспертный',  hint:'спорные случаи и последствия' }
};

/* ================= Сборка модели ================= */
Object.assign(ACTS, ACTS_EXT);
const LESSONS = [...G1_LESSONS, ...G2_LESSONS, ...G3_LESSONS, ...VAX_LESSONS, ...CHK_LESSONS];
const QUESTIONS = [...G1_QUESTIONS, ...G2_QUESTIONS, ...G3_QUESTIONS, ...VAX_QUESTIONS, ...CHK_QUESTIONS];

// у старых уроков уровень хранился в поле grade — нормализуем
LESSONS.forEach(l => { if (l.level === undefined) l.level = l.grade || 1; if (l.video === undefined) l.video = null; });
const L_BY_ID = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const C_BY_ID = Object.fromEntries(COURSES.map(c => [c.id, c]));
const D_BY_ID = Object.fromEntries(DIRECTIONS.map(d => [d.id, d]));
// привязка урок → курс/направление
COURSES.forEach(c => c.lessons.forEach(id => { const l = L_BY_ID[id]; if (l) { l.course = c.id; l.dir = c.dir; } }));
QUESTIONS.forEach(q => { const l = L_BY_ID[q.l]; q.course = l ? l.course : null; q.dir = l ? l.dir : null; q.level = q.g; });

const PASS = 0.8, COMPLAINTS_TO_FREEZE = 3;
const courseLessons = c => c.lessons.map(id => L_BY_ID[id]).filter(Boolean);
const courseQuestions = c => QUESTIONS.filter(q => q.course === c.id && !frozen(q.id));
const dirCourses = d => COURSES.filter(c => c.dir === d).sort((a, b) => a.step - b.step);
const courseLevels = c => [...new Set(courseLessons(c).map(l => l.level))].sort();
const examSize = c => Math.min(20, courseQuestions(c).length);

/* ================= Состояние ================= */
const KEY = 'lms-npa-v2';
const blank = () => ({ courses:{}, complaints:{}, read:{}, ca:{}, name:'', drills:[] });
let S = load();
function load(){ try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function cs(id){ return S.courses[id] || (S.courses[id] = { attempts:[], passed:false, caDone:true, caList:[] }); }
function frozen(id){ return (S.complaints[id] || 0) >= COMPLAINTS_TO_FREEZE; }
function courseState(c){
  const d = cs(c.id);
  if (d.passed) return 'done';
  if (d.attempts.length) return 'progress';
  const ls = courseLessons(c);
  return ls.some(l => S.read[l.id]) ? 'progress' : 'new';
}
function dirProgress(dirId){
  const cl = dirCourses(dirId);
  const done = cl.filter(c => cs(c.id).passed).length;
  return { done, total: cl.length, pct: cl.length ? Math.round(done / cl.length * 100) : 0 };
}
function nextRecommended(dirId){
  return dirCourses(dirId).find(c => !cs(c.id).passed) || null;
}

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ const r = a.slice(); for (let i = r.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; } return r; }
function fmt(sec){ return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function actLine(a){ return `${esc(a.title)} — № ${esc(a.num)} от ${esc(a.date)}`; }
function levelChip(n){ return `<span class="chip lvl${n}">${LEVELS[n].name}</span>`; }
function scrollTop(){ window.scrollTo({ top:0, behavior:'smooth' }); }

/* ================= Роутер ================= */
let VIEW = { name:'catalog' };
function go(view){ VIEW = view; render(); scrollTop(); }
function setTab(name){
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === name)));
}
function render(){
  const v = VIEW;
  document.body.classList.toggle('printing-course', v.name === 'course-print');
  setTab(v.name === 'course' || v.name === 'course-print' || v.name === 'lesson' || v.name === 'direction' || v.name === 'exam' || v.name === 'result' ? 'catalog' : v.name);
  const el = $('#app');
  if (v.name === 'catalog')   el.innerHTML = viewCatalog();
  else if (v.name === 'direction') el.innerHTML = viewDirection(v.dir);
  else if (v.name === 'course')    el.innerHTML = viewCourse(v.course);
  else if (v.name === 'course-print') el.innerHTML = viewCoursePrint(v.course);
  else if (v.name === 'lesson')    el.innerHTML = viewLesson(v.lesson);
  else if (v.name === 'drill')     el.innerHTML = viewDrillSetup();
  else if (v.name === 'chief')     el.innerHTML = viewChief();
  else if (v.name === 'about')     el.innerHTML = viewAbout();
  bind();
}

/* ================= Каталог по направлениям (п.1, п.2) ================= */
function viewCatalog(){
  const q = (S.query || '').trim();
  if (q) return viewSearch(q);
  const cards = DIRECTIONS.map(d => {
    const cl = dirCourses(d.id), p = dirProgress(d.id), next = nextRecommended(d.id);
    const qn = cl.reduce((s,c) => s + courseQuestions(c).length, 0);
    return `<button class="dircard" data-dir="${d.id}">
      <span class="dirmark">${esc(d.icon)}</span>
      <span class="dirbody">
        <span class="row" style="gap:8px"><h3>${esc(d.title)}</h3>
          ${p.done ? `<span class="chip done">${p.done} из ${p.total}</span>` : `<span class="chip locked">${cl.length} ${cl.length===1?'курс':'курса'}</span>`}</span>
        <span class="note">${esc(d.desc)}</span>
        <span class="meter" style="margin-top:10px"><i style="width:${p.pct}%"></i></span>
        <span class="note" style="margin-top:8px;display:block">${qn} вопросов${next ? ` · далее: ${esc(next.title)}` : ' · направление пройдено'}</span>
      </span></button>`;
  }).join('');
  const totalQ = QUESTIONS.filter(q2 => !frozen(q2.id)).length;
  const passed = COURSES.filter(c => cs(c.id).passed).length;
  return `<div class="hd"><div class="grow">
      <div class="eyebrow">Каталог обучения</div>
      <h2 style="margin-top:6px">Направления деятельности</h2>
      <p class="lead">Выберите направление своей работы. Внутри направления курсы выстроены в рекомендованном порядке, но проходить их можно в любой последовательности — ничего не блокируется.</p>
    </div></div>
    <div class="grid-2" style="margin-bottom:18px">
      <div class="stat"><div class="v">${DIRECTIONS.length}</div><div class="l">Направлений</div></div>
      <div class="stat"><div class="v">${COURSES.length}</div><div class="l">Курсов</div></div>
      <div class="stat"><div class="v">${totalQ}</div><div class="l">Вопросов в банке</div></div>
      <div class="stat"><div class="v" style="color:var(--good)">${passed}</div><div class="l">Курсов пройдено вами</div></div>
    </div>
    <div class="dirgrid">${cards}</div>`;
}

/* ================= Направление: маршрут курсов ================= */
function viewDirection(dirId){
  const d = D_BY_ID[dirId], cl = dirCourses(dirId), next = nextRecommended(dirId);
  const items = cl.map(c => {
    const st = courseState(c), data = cs(c.id);
    const last = data.attempts[data.attempts.length-1];
    const lv = courseLevels(c).map(levelChip).join(' ');
    const rec = next && next.id === c.id;
    const chip = st === 'done' ? '<span class="chip done">Пройден</span>'
      : st === 'progress' ? '<span class="chip warn">В процессе</span>' : '<span class="chip open">Доступен</span>';
    return `<div class="panel course ${rec ? 'rec' : ''}">
      <div class="panel-pad">
        <div class="row" style="gap:9px;margin-bottom:4px">
          <span class="stepn">Шаг ${c.step}</span>${chip}${rec ? '<span class="chip rec">Рекомендуем начать отсюда</span>' : ''}
        </div>
        <h3 style="font-size:17px">${esc(c.title)}</h3>
        <p class="note" style="margin-top:6px">${esc(c.intro)}</p>
        <div class="row" style="gap:6px;margin-top:10px">${lv}
          <span class="note">${courseLessons(c).length} ${courseLessons(c).length===1?'урок':'урока'} · ${courseQuestions(c).length} вопросов${last ? ` · последний результат ${last.pct}%` : ''}</span></div>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" data-course="${c.id}">${st==='new'?'Начать курс':'Открыть курс'}</button>
          <button class="btn" data-drill-course="${c.id}">Пробный тест по курсу</button>
        </div>
      </div></div>`;
  }).join('');
  return `<div class="hd">
      <div class="grow">
        <div class="eyebrow">Направление</div>
        <h2 style="margin-top:6px">${esc(d.title)}</h2>
        <p class="lead">${esc(d.desc)}</p>
      </div>
      <button class="btn" data-go="catalog">← Все направления</button></div>
    <div class="stack">${items}</div>`;
}

/* ================= Курс ================= */
function viewCourse(courseId){
  const c = C_BY_ID[courseId], d = D_BY_ID[c.dir], data = cs(c.id);
  const ls = courseLessons(c);
  const tries = data.attempts.length, last = data.attempts[tries-1];
  const needCA = !data.passed && tries > 0 && !data.caDone;
  const lessons = ls.map((l, i) => {
    const done = !!S.read[l.id];
    return `<div class="panel"><div class="panel-pad" style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div class="row" style="gap:8px">
          <span class="stepn">Урок ${i+1}</span>${levelChip(l.level)}${done ? '<span class="chip done">Изучен</span>' : ''}
          ${l.video ? '<span class="chip video">Видео</span>' : ''}
        </div>
        <h3 style="font-size:16.5px;margin-top:7px">${esc(l.title)}</h3>
        <p class="note" style="margin-top:6px">${esc(l.intro)}</p>
        <p class="note" style="margin-top:6px;color:var(--ink-3)">${l.cards.length} норм · ${QUESTIONS.filter(q => q.l===l.id).length} вопросов</p>
      </div>
      <button class="btn" data-lesson="${l.id}">${done ? 'Повторить' : 'Изучить'}</button>
    </div></div>`;
  }).join('');

  let status = '';
  if (data.passed) status = `<div class="panel panel-pad" style="border-color:var(--good)">
      <div class="eyebrow" style="color:var(--good)">Курс пройден</div>
      <p style="margin-top:6px;font-size:15px">Последний результат — <b>${last.pct}%</b> (${last.right} из ${last.total}).</p></div>`;
  else if (needCA) status = renderCA(c, data, last);

  const history = tries ? `<div class="panel panel-pad"><div class="eyebrow">История попыток</div>
      <div class="grid-2" style="margin-top:12px">${data.attempts.map((a,i) => `
        <div class="stat ${a.pass?'pass':'fail'}"><div class="v">${a.pct}%</div>
        <div class="l">Попытка ${i+1} · ${a.right} из ${a.total}${i>0 ? ` · <span class="delta ${a.pct-data.attempts[i-1].pct>=0?'up':'down'}">${a.pct-data.attempts[i-1].pct>=0?'+':''}${a.pct-data.attempts[i-1].pct} п.п.</span>` : ''}</div></div>`).join('')}
      </div></div>` : '';

  return `<div class="hd">
      <div class="grow">
        <div class="eyebrow"><a href="#" data-dir="${d.id}" class="crumb">${esc(d.title)}</a> · шаг ${c.step}</div>
        <h2 style="margin-top:6px">${esc(c.title)}</h2>
        <p class="lead">${esc(c.intro)}</p>
      </div>
      <button class="btn" data-dir="${d.id}">← К направлению</button></div>
    <div><button class="btn" data-course-print="${c.id}">Материалы курса в PDF</button></div>
    ${status}
    <div class="stack">${lessons}</div>
    <div class="panel panel-pad" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <h3 style="font-size:16.5px">Экзамен курса</h3>
        <p class="note" style="margin-top:5px">${examSize(c)} вопросов, проходной порог ${Math.round(PASS*100)}%. Попытки не ограничены${needCA ? '. Сейчас назначены корректирующие действия' : ''}.</p>
      </div>
      <button class="btn primary" data-exam="${c.id}" ${needCA?'disabled':''}>Начать экзамен</button>
    </div>
    ${history}`;
}

/* ================= Урок (с видео, п.3) ================= */

        <p class="lead">${esc(l.intro)}</p>
        <div class="row" style="gap:6px;margin-top:8px">${levelChip(l.level)}</div>
      </div>

/* ================= Поиск (п.5) ================= */
function norm(s){ return String(s).toLowerCase().replace(/ё/g,'е'); }
function searchAll(q){
  const t = norm(q).split(/\s+/).filter(Boolean);
  const has = txt => { const n = norm(txt); return t.every(w => n.includes(w)); };
  const res = { courses:[], lessons:[], norms:[], questions:[] };
  COURSES.forEach(c => { const d = D_BY_ID[c.dir];
    if (has(c.title + ' ' + c.intro + ' ' + d.title)) res.courses.push(c); });
  LESSONS.forEach(l => { if (has(l.title + ' ' + l.intro)) res.lessons.push(l); });
  LESSONS.forEach(l => l.cards.forEach(cd => {
    const a = ACTS[cd.a];
    if (has(cd.norm + ' ' + cd.plain + ' ' + a.title + ' ' + a.num)) res.norms.push({ l, cd, a });
  }));
  QUESTIONS.forEach(qq => { if (!frozen(qq.id) && has(qq.q + ' ' + qq.o.join(' '))) res.questions.push(qq); });
  return res;
}
function viewSearch(q){
  const r = searchAll(q);
  const total = r.courses.length + r.lessons.length + r.norms.length + r.questions.length;
  const block = (title, items, html) => items.length
    ? `<div class="panel panel-pad" style="margin-bottom:16px"><div class="eyebrow">${title} · ${items.length}</div>
       <div class="stack" style="margin-top:12px">${html}</div></div>` : '';
  return `<div class="hd"><div class="grow">
      <div class="eyebrow">Поиск</div>
      <h2 style="margin-top:6px">${total ? `Найдено ${total}` : 'Ничего не найдено'} по запросу «${esc(q)}»</h2>
      ${total ? '' : '<p class="lead">Попробуйте другое слово — поиск идёт по названиям курсов и уроков, текстам норм, реквизитам актов и формулировкам вопросов.</p>'}
    </div><button class="btn" id="btn-clear-search">Очистить</button></div>
    ${block('Курсы', r.courses, r.courses.map(c => `
      <button class="hit" data-course="${c.id}"><b>${esc(c.title)}</b>
        <span class="note">${esc(D_BY_ID[c.dir].title)} · шаг ${c.step} · ${esc(c.intro)}</span></button>`).join(''))}
    ${block('Уроки', r.lessons, r.lessons.map(l => `

      </div>

        <span class="note">Подходящих вопросов в банке: <b>${pool.length}</b></span>

function drillPool(f){
  return QUESTIONS.filter(q => !frozen(q.id)
    && (!f.dir || q.dir === f.dir)
    && (!f.course || q.course === f.course)
    && (!f.level || String(q.level) === String(f.level)));
}

/* ================= Экзамен и тренажёр ================= */
let EX = null;
function startExam(courseId){
  const c = C_BY_ID[courseId];
  const pool = shuffle(courseQuestions(c)).slice(0, examSize(c));
  EX = { mode:'exam', course:c.id, label:c.title, qs:pool.map(q => ({ q, order:shuffle([0,1,2,3]) })),
         i:0, answers:[], left:Math.max(10, pool.length*90), timer:null };
  tick(); drawQ();
}
function startDrill(filter, label){
  const pool = shuffle(drillPool(filter)).slice(0, filter.count || 10);
  if (!pool.length) return;
  EX = { mode:'drill', label, qs:pool.map(q => ({ q, order:shuffle([0,1,2,3]) })),
         i:0, answers:[], left:0, timer:null };
  drawQ();
}
function tick(){
  clearInterval(EX.timer);
  EX.timer = setInterval(() => {
    EX.left--;
    const t = $('#timer');
    if (t){ t.textContent = fmt(EX.left); t.classList.toggle('low', EX.left <= 120); }
    if (EX.left <= 0){ clearInterval(EX.timer); finish(true); }
  }, 1000);
}
function stopExam(){ if (EX){ clearInterval(EX.timer); EX = null; } }

function drawQ(){
  const it = EX.qs[EX.i], q = it.q, a = ACTS[q.a];
  const chosen = EX.answers[EX.i], answered = chosen !== undefined;
  const opts = it.order.map((oi,k) => {
    const isRight = oi === q.c, isChosen = chosen === oi;
    let cls = 'opt';
    if (answered && isRight) cls += ' right'; else if (answered && isChosen) cls += ' wrong';
    return `<button class="${cls}" data-o="${oi}" ${answered?'disabled':''} aria-pressed="${isChosen?'true':'false'}">
      <span class="k">${'АБВГ'[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join('');
  const explain = answered ? `<div class="explain">
      <div class="row" style="gap:8px;margin-bottom:8px">
        <span class="chip ${chosen===q.c?'done':'crit'}">${chosen===q.c?'Верно':'Неверно'}</span>
        <span class="pt">п. ${q.p}</span>${levelChip(q.level)}
      </div>
      <p class="t">${esc(q.e)}</p>
      <div class="srcline"><span>${actLine(a)}</span>
        <a href="${a.url}" target="_blank" rel="noopener">Первоисточник →</a>
        <button class="btn sm ghost" id="btn-complain" style="margin-left:auto">Оспорить вопрос</button></div>
      <div id="complain-msg" class="note" style="margin-top:8px"></div></div>` : '';
  const last = EX.i === EX.qs.length - 1;
  $('#app').innerHTML = `
    <div class="exam-top">
      <span class="eyebrow">${EX.mode==='exam'?'Экзамен':'Тест'} · ${esc(EX.label)}</span>
      <span class="qnum">Вопрос ${EX.i+1} из ${EX.qs.length}</span>
      <div class="meter" style="flex:1;min-width:110px"><i style="width:${EX.i/EX.qs.length*100}%"></i></div>
      ${EX.mode==='exam' ? `<span class="timer${EX.left<=120?' low':''}" id="timer">${fmt(EX.left)}</span>` : ''}
      <button class="btn sm ghost" id="btn-quit">Выйти</button>
    </div>
    <div class="panel panel-pad qbody">
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${opts}</div>${explain}
      <div class="exam-foot">
        <button class="btn primary" id="btn-next" ${answered?'':'disabled'}>${last?'Завершить':'Следующий вопрос'}</button>
        <span class="note">${answered?'':'Выберите один вариант'}</span>
      </div></div>`;
  $$('.opt').forEach(b => b.addEventListener('click', () => {
    if (EX.answers[EX.i] !== undefined) return;
    EX.answers[EX.i] = +b.dataset.o; drawQ();
  }));
  $('#btn-next').addEventListener('click', () => { if (last) finish(false); else { EX.i++; drawQ(); scrollTop(); } });
  $('#btn-quit').addEventListener('click', () => {
    const back = EX.mode === 'exam' ? { name:'course', course:EX.course } : { name:'drill' };
    stopExam(); go(back);
  });
  const bc = $('#btn-complain');
  if (bc) bc.addEventListener('click', () => {
    S.complaints[q.id] = (S.complaints[q.id]||0) + 1; save();
    const n = S.complaints[q.id];
    $('#complain-msg').textContent = n >= COMPLAINTS_TO_FREEZE
      ? `Жалоба принята (${n}). Вопрос заморожен и больше не выдаётся до разбора администратором.`
      : `Жалоба принята (${n} из ${COMPLAINTS_TO_FREEZE}). При ${COMPLAINTS_TO_FREEZE} жалобах вопрос замораживается.`;
    bc.disabled = true;
  });
}

function finish(byTime){
  clearInterval(EX.timer);
  let right = 0; const wrongByLesson = {}, wrongQs = [];
  EX.qs.forEach((it,i) => {
    if (EX.answers[i] === it.q.c) right++;
    else { wrongByLesson[it.q.l] = (wrongByLesson[it.q.l]||0) + 1; wrongQs.push(it.q); }
  });
  const total = EX.qs.length, pct = Math.round(right/total*100), pass = right/total >= PASS;
  const isExam = EX.mode === 'exam', label = EX.label, courseId = EX.course;
  let delta = null;
  if (isExam){
    const d = cs(courseId);
    d.attempts.push({ pct, right, total, pass, wrongByLesson, byTime });
    if (pass){ d.passed = true; d.caDone = true; }
    else { d.caList = Object.keys(wrongByLesson); d.caDone = false; d.caList.forEach(id => S.ca[id] = false); }
    if (d.attempts.length > 1) delta = pct - d.attempts[d.attempts.length-2].pct;
  } else {
    S.drills = (S.drills||[]).concat([{ pct, right, total, label }]).slice(-20);
  }
  save();

  const breakdown = wrongQs.length ? `<div class="panel panel-pad"><div class="eyebrow">Разбор ошибок</div>
      <div style="margin-top:14px">${wrongQs.map(q => { const a = ACTS[q.a];
        return `<div class="norm"><div class="norm-h"><span class="pt">п. ${q.p}</span><span class="src">${esc(a.title)}</span></div>
          <div class="norm-b"><p style="font-weight:600;font-size:15px">${esc(q.q)}</p>
          <div class="plain" style="margin-top:10px"><b>Верно</b><span>${esc(q.o[q.c])}</span></div>
          <p class="note" style="margin-top:10px;color:var(--ink-2)">${esc(q.e)}</p>
          <div class="srcline"><span>№ ${esc(a.num)} от ${esc(a.date)}</span>
            <a href="${a.url}" target="_blank" rel="noopener">Первоисточник →</a>
            <button class="btn sm ghost" data-lesson="${q.l}" style="margin-left:auto">К уроку</button></div>
          </div></div>`; }).join('')}</div></div>` : '';

  $('#app').innerHTML = `<div class="hd"><div class="grow">
      <div class="eyebrow">${isExam?'Результат экзамена':'Результат теста'} · ${esc(label)}</div>
      <h2 style="margin-top:6px">${isExam ? (pass?'Курс пройден':'Порог не достигнут') : `${pct}% верных ответов`}</h2>
      <p class="lead">${byTime?'Время истекло, засчитаны данные ответы. ':''}${
        isExam ? (pass ? 'Результат сохранён. Остальные курсы доступны в любом порядке.'
                       : `Для сдачи нужно не менее ${Math.round(PASS*100)}%. Назначены корректирующие действия по темам с ошибками.`)
               : 'Тренировочный тест не влияет на прохождение курсов — он для самопроверки.'}</p>
    </div></div>
    <div class="grid-2">
      <div class="stat ${pass?'pass':(isExam?'fail':'')}"><div class="v">${pct}%</div><div class="l">Результат</div></div>
      <div class="stat"><div class="v">${right}<span style="font-size:18px;color:var(--ink-3)"> / ${total}</span></div><div class="l">Верных ответов</div></div>
      ${isExam ? `<div class="stat"><div class="v">${Math.round(PASS*100)}%</div><div class="l">Проходной порог</div></div>
      <div class="stat"><div class="v" style="${delta===null?'':'color:var(--'+(delta>=0?'good':'crit')+')'}">${delta===null?'—':(delta>=0?'+':'')+delta}</div>
        <div class="l">${delta===null?'Первая попытка — база для сравнения':'Прогресс к прошлой попытке, п.п.'}</div></div>` : ''}
    </div>
    <div class="row">
      ${isExam ? `<button class="btn primary" data-course="${courseId}">Вернуться к курсу</button>` : `<button class="btn primary" data-go="drill">К тестированию</button>`}
      <button class="btn" data-go="catalog">В каталог</button>
    </div>${breakdown}`;
  EX = null;
  bind();
  scrollTop();
}

function viewChief(){
  const mine = COURSES.map(c => cs(c.id)).filter(d => d.attempts.length);
  const myDone = COURSES.filter(c => cs(c.id).passed).length;

      <div class="stat"><div class="v" style="color:var(--${avgD===null||avgD>=0?'good':'crit'})">${avgD===null?'—':(avgD>=0?'+':'')+avgD}</div><div class="l">Средний прирост, п.п.</div></div>
    </div>
    <div class="tblwrap" style="margin-top:18px"><table>
      <thead><tr><th>Сотрудник</th><th>Должность</th><th>Курсов пройдено</th><th>1-я попытка</th><th>Повторная</th><th>Прогресс</th></tr></thead>
      <tbody>${rows.map(r => {
        const d = (r.first !== null && r.second !== null) ? r.second - r.first : null;
        return `<tr${r.me?' style="background:var(--accent-wash)"':''}>
          <td><b>${esc(r.n)}</b></td><td class="note">${esc(r.role)}</td>
          <td class="num">${r.done} из ${COURSES.length}</td>
          <td class="num">${r.first===null?'—':r.first+'%'}</td>

          <td class="num">${d===null?'—':`<span class="delta ${d>=0?'up':'down'}">${d>=0?'+':''}${d} п.п.</span>`}</td></tr>`;

/* ================= Обработчики ================= */
function bind(){
  $$('[data-course-print]').forEach(b => b.addEventListener('click', () => go({ name:'course-print', course:b.dataset.coursePrint })));
  const print = $('#btn-print-course');
  if (print) print.addEventListener('click', () => window.print());
  $$('[data-dir]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go({ name:'direction', dir:b.dataset.dir }); }));
  $$('[data-course]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go({ name:'course', course:b.dataset.course }); }));
  $$('[data-lesson]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go({ name:'lesson', lesson:b.dataset.lesson }); }));
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go({ name:b.dataset.go })));
  $$('[data-exam]').forEach(b => b.addEventListener('click', () => startExam(b.dataset.exam)));
  $$('[data-read]').forEach(b => b.addEventListener('click', () => { S.read[b.dataset.read] = true; save(); render(); }));
  $$('[data-drill-course]').forEach(b => b.addEventListener('click', () => {
    const c = C_BY_ID[b.dataset.drillCourse];
    startDrill({ course:c.id, count:10 }, 'Пробный тест: ' + c.title);
  }));
  $$('[data-drill-lesson]').forEach(b => b.addEventListener('click', () => {
    const l = L_BY_ID[b.dataset.drillLesson];
    const pool = QUESTIONS.filter(q => q.l === l.id && !frozen(q.id));
    if (!pool.length) return;
    EX = { mode:'drill', label:'Тема: ' + l.title, qs:shuffle(pool).slice(0,10).map(q => ({ q, order:shuffle([0,1,2,3]) })), i:0, answers:[], left:0, timer:null };
    drawQ();
  }));
  $$('[data-quick]').forEach(b => b.addEventListener('click', () => {
    startDrill({ dir:b.dataset.quick, count:10 }, 'Быстрый тест: ' + D_BY_ID[b.dataset.quick].title);
  }));
  $$('[data-ca]').forEach(cb => cb.addEventListener('change', () => { S.ca[cb.dataset.ca] = cb.checked; save(); render(); }));
  const cad = $('#btn-ca-done');
  if (cad) cad.addEventListener('click', () => {
    const c = C_BY_ID[VIEW.course], d = cs(c.id);
    d.caDone = true; d.caList.forEach(id => S.ca[id] = false); save(); render();
  });
  const cl = $('#btn-clear-search');
  if (cl) cl.addEventListener('click', () => { S.query = ''; $('#search').value = ''; render(); });
  const ds = $('#btn-drill-start');
  if (ds) ds.addEventListener('click', () => {
    const f = readFilter();
    const parts = [f.dir ? D_BY_ID[f.dir].title : 'Все направления', f.level ? LEVELS[f.level].name : null].filter(Boolean);
    startDrill(f, parts.join(' · '));
  });
  ['f-dir','f-course','f-level','f-count'].forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('change', () => { S.drillFilter = readFilter(); save(); render(); });
  });
}
function readFilter(){
  const g = id => { const e = $('#' + id); return e ? e.value : ''; };
  const f = { dir:g('f-dir'), course:g('f-course'), level:g('f-level'), count:+(g('f-count') || 10) };
  if (f.course && C_BY_ID[f.course] && f.dir && C_BY_ID[f.course].dir !== f.dir) f.course = '';
  return f;
}

/* ================= Старт ================= */
$$('.tab').forEach(t => t.addEventListener('click', () => { stopExam(); S.query = ''; $('#search').value = ''; go({ name:t.dataset.view }); }));
$('#search').addEventListener('input', e => {
  S.query = e.target.value;
  if (VIEW.name !== 'catalog') VIEW = { name:'catalog' };
  render();
  const box = $('#search'); if (box && document.activeElement !== box) box.focus();
});
$('#btn-reset').addEventListener('click', () => {
  if (confirm('Сбросить весь прогресс обучения? Это действие нельзя отменить.')){
    S = blank(); save(); go({ name:'catalog' });
  }
});
render();

</script>
